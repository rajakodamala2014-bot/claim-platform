server:
  port: ${PORT:8080}

spring:
  application:
    name: claims-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USER:claims}
    password: ${DB_PASSWORD:claims}
  flyway:
    # One schema per module; the Flyway history table lives in the first one (platform).
    schemas: platform,core,intake,handling,settlement
    create-schemas: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: claims-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

claims:
  policy-system:
    base-url: ${POLICY_BASE_URL:http://localhost:8089}
    timeout: 2s
    cache-ttl: 5m
  documents:
    storage-dir: ${DOCUMENT_STORAGE_DIR:data/documents}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    # required; no default outside the dev profile so production can't run with a known key
    signing-secret: ${DOCUMENT_SIGNING_SECRET:}
    url-ttl: 15m
  outbox:
    relay:
      enabled: true
      interval: 500ms
      batch-size: 200
  jobs:
    enabled: true
    cover-check-retry-interval: 10m
    info-request-expiry-cron: "0 0 1 * * *"   # daily 01:00 UTC
    auto-close-cron: "0 30 1 * * *"           # daily 01:30 UTC
  payments:
    # HMAC key of the fallback payments webhook (required; dev profile provides a local one)
    webhook-secret: ${PAYMENTS_WEBHOOK_SECRET:}
  crypto:
    # AES-256 key (base64) for bank account numbers at rest (required; dev profile provides a local one)
    field-key: ${FIELD_ENCRYPTION_KEY:}

platform:
  openapi:
    title: Claims Service API
    description: Claim intake, handling and settlement for customers (/claimant/v1) and staff (/staff/v1). Source of truth for claims.
  messaging:
    processed-event-table: platform.processed_event
  security:
    # Real environments: the identity provider. Unset -> the dev HS256 key (dev profile) must be configured.
    issuer-uri: ${OIDC_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always

logging:
  structured:
    format:
      console: com.claims.platform.web.common.MaskingJsonLogFormatter
