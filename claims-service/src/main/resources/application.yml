server:
  port: 8082

spring:
  application:
    name: claims-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/claims_db
    username: claims
    password: claims
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

claims:
  security:
    jwt-secret: claims-platform-dev-secret-change-me!!
    issuer: claims-platform
    access-token-ttl: 1h
    internal-token: dev-internal-token
    internal-paths:
      - /api/v1/settlements/*/confirmation
  identity:
    base-url: http://localhost:8081
  events:
    consumer-urls:
      - http://localhost:8084/api/v1/internal/events
      - http://localhost:8085/api/v1/internal/events
  outbox:
    delay-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
