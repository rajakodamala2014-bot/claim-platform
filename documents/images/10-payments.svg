  <rect x="105.8" y="82.0" width="278.5" height="17" rx="4" fill="#ffffff"/>
  <text x="245.0" y="91.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">1. POST /staff/v1/claims/{id}/settlements</text>
  <rect x="420.8" y="122.0" width="148.5" height="17" rx="4" fill="#ffffff"/>
  <text x="495.0" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">2. forward (If-Match)</text>
  <rect x="670.0" y="181.0" width="239.5" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="190.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">3. encrypt account number (AES-GCM)</text>
  <rect x="670.0" y="227.0" width="395.5" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="236.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">4. SETTLEMENT_IN_PROGRESS + SettlementRequest in the outbox</text>
  <rect x="308.8" y="254.0" width="122.5" height="17" rx="4" fill="#ffffff"/>
  <text x="370.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">5. 200 · new ETag</text>
  <rect x="670.0" y="313.0" width="330.5" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="322.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">6. relay publishes, then masks the account number</text>
  <rect x="638.2" y="340.0" width="213.5" height="17" rx="4" fill="#ffffff"/>
  <text x="745.0" y="349.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">7. payments.settlement-requests</text>
  <rect x="868.8" y="380.0" width="252.5" height="17" rx="4" fill="#ffffff"/>
  <text x="995.0" y="389.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">8. settlement request (instructionId)</text>
  <rect x="818.5" y="439.0" width="291.5" height="18" rx="4" fill="#ffffff"/>
  <text x="1104.0" y="448.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">9. pay (locally: account ending 0000 fails)</text>
  <rect x="898.0" y="466.0" width="194.0" height="17" rx="4" fill="#ffffff"/>
  <text x="995.0" y="475.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">10. payments.payment-results</text>
  <rect x="680.5" y="506.0" width="129.0" height="17" rx="4" fill="#ffffff"/>
  <text x="745.0" y="515.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">11. payment result</text>
  <rect x="670.0" y="599.0" width="363.0" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="608.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">12. PaymentConfirmed + ClaimSettled · reserve released</text>
  <rect x="670.0" y="675.0" width="324.0" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="684.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">13. PaymentFailed · stays SETTLEMENT_IN_PROGRESS</text>
  <rect x="73.2" y="702.0" width="343.5" height="17" rx="4" fill="#ffffff"/>
  <text x="245.0" y="711.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">14. POST …/settlements/{id}/retry (corrected payee)</text>
  <rect x="453.2" y="742.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="495.0" y="751.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">15. forward</text>
  <rect x="670.0" y="801.0" width="311.0" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="810.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">16. new instructionId → new settlement request</text>
  <rect x="691.8" y="876.0" width="356.5" height="17" rx="4" fill="#ffffff"/>
  <text x="870.0" y="885.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">17. POST /internal/v1/payments/callback (X-Signature)</text>
  <rect x="670.0" y="935.0" width="421.5" height="18" rx="4" fill="#ffffff"/>
  <text x="676.0" y="944.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">18. same handling · results for old instruction ids are ignored</text>
</svg>
