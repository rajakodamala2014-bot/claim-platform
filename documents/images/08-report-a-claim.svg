  <rect x="279.8" y="122.0" width="135.5" height="17" rx="4" fill="#ffffff"/>
  <text x="347.5" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">2. POST /auth/login</text>
  <rect x="474.0" y="162.0" width="77.0" height="17" rx="4" fill="#ffffff"/>
  <text x="512.5" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">3. forward</text>
  <rect x="346.0" y="202.0" width="168.0" height="17" rx="4" fill="#ffffff"/>
  <text x="430.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">4. token (role, markets)</text>
  <rect x="250.5" y="242.0" width="194.0" height="17" rx="4" fill="#ffffff"/>
  <text x="347.5" y="251.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">5. GET /claimant/v1/policies</text>
  <rect x="474.0" y="282.0" width="77.0" height="17" rx="4" fill="#ffffff"/>
  <text x="512.5" y="291.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">6. forward</text>
  <rect x="574.0" y="322.0" width="207.0" height="17" rx="4" fill="#ffffff"/>
  <text x="677.5" y="331.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">7. get policies (cached 5 min)</text>
  <rect x="635.8" y="362.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="677.5" y="371.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">8. policies</text>
  <rect x="388.2" y="402.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="430.0" y="411.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">9. policies</text>
  <rect x="247.2" y="476.0" width="200.5" height="17" rx="4" fill="#ffffff"/>
  <text x="347.5" y="485.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">10. POST /claimant/v1/uploads</text>
  <rect x="470.8" y="516.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="512.5" y="525.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">11. forward</text>
  <rect x="355.8" y="556.0" width="148.5" height="17" rx="4" fill="#ffffff"/>
  <text x="430.0" y="565.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">12. signed upload URL</text>
  <rect x="244.0" y="596.0" width="207.0" height="17" rx="4" fill="#ffffff"/>
  <text x="347.5" y="605.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">13. PUT file to the signed URL</text>
  <rect x="470.8" y="636.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="512.5" y="645.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">14. forward</text>
  <rect x="645.0" y="695.0" width="252.5" height="18" rx="4" fill="#ffffff"/>
  <text x="651.0" y="704.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">15. store the document (HMAC checked)</text>
  <rect x="192.0" y="736.0" width="311.0" height="17" rx="4" fill="#ffffff"/>
  <text x="347.5" y="745.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">16. POST /claimant/v1/claims (Idempotency-Key)</text>
  <rect x="470.8" y="776.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="512.5" y="785.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">17. forward</text>
  <rect x="577.2" y="816.0" width="200.5" height="17" rx="4" fill="#ffffff"/>
  <text x="677.5" y="825.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">18. cover check (2 s timeout)</text>
  <rect x="600.0" y="856.0" width="155.0" height="17" rx="4" fill="#ffffff"/>
  <text x="677.5" y="865.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">19. answer, or timeout</text>
  <rect x="645.0" y="915.0" width="512.5" height="18" rx="4" fill="#ffffff"/>
  <text x="651.0" y="924.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">20. one transaction: claim SUBMITTED (cover confirmed) + claim_event + outbox</text>
  <rect x="326.5" y="942.0" width="207.0" height="17" rx="4" fill="#ffffff"/>
  <text x="430.0" y="951.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">21. 201 Created · claim number</text>
  <rect x="645.0" y="1001.0" width="220.0" height="18" rx="4" fill="#ffffff"/>
  <text x="651.0" y="1010.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">22. outbox relay, within ~500 ms</text>
  <rect x="620.8" y="1028.0" width="278.5" height="17" rx="4" fill="#ffffff"/>
  <text x="760.0" y="1037.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">23. ClaimSubmitted on claims.claim-events</text>
  <rect x="972.2" y="1068.0" width="70.5" height="17" rx="4" fill="#ffffff"/>
  <text x="1007.5" y="1077.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">24. event</text>
  <rect x="840.5" y="1127.0" width="239.5" height="18" rx="4" fill="#ffffff"/>
  <text x="1074.0" y="1136.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">25. claim appears in the work queue</text>
  <rect x="1054.8" y="1154.0" width="70.5" height="17" rx="4" fill="#ffffff"/>
  <text x="1090.0" y="1163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">26. event</text>
  <rect x="1057.5" y="1213.0" width="187.5" height="18" rx="4" fill="#ffffff"/>
  <text x="1239.0" y="1222.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">27. confirm to the customer</text>
