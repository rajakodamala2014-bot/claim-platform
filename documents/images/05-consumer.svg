<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a consumer handles a message</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M400,68 L400,98" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M500,138 L698,138" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,176 L400,218" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M290,258 L222,258" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,296 L400,338" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,400 L400,438" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,516 L400,558" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M480,478 L618,478" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M710,440 L710,370 L562,370" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M800,478 L850,478 L850,166" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="290" y="24" width="220" height="44" rx="22.0" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/></g>
  <text x="400.0" y="46.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#581c87" text-anchor="middle" dominant-baseline="central">Message arrives</text>
  <g filter="url(#shadow)"><path d="M400.0,100 L500,138.0 L400.0,176 L300,138.0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/></g>
  <text x="400.0" y="138.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="central">Malformed?</text>
  <g filter="url(#shadow)"><rect x="700" y="112" width="220" height="52" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/></g>
  <text x="810.0" y="130.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle" dominant-baseline="central">&lt;topic&gt;.dlq</text>
  <text x="810.0" y="147.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">dead-letter topic, kept 14 days</text>
  <g filter="url(#shadow)"><path d="M400.0,220 L510,258.0 L400.0,296 L290,258.0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/></g>
  <text x="400.0" y="258.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="central">Already processed?</text>
  <g filter="url(#shadow)"><rect x="30" y="232" width="190" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/></g>
  <text x="125.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle" dominant-baseline="central">Skip</text>
  <text x="125.0" y="267.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">consumers are idempotent</text>
  <g filter="url(#shadow)"><rect x="240" y="340" width="320" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="400.0" y="362.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Apply the change</text>
  <text x="400.0" y="379.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">and mark processed in one transaction</text>
  <g filter="url(#shadow)"><path d="M400.0,440 L480,478.0 L400.0,516 L320,478.0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/></g>
  <text x="400.0" y="478.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="central">Succeeded?</text>
  <g filter="url(#shadow)"><rect x="340" y="560" width="120" height="44" rx="22.0" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/></g>
  <text x="400.0" y="582.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle" dominant-baseline="central">Done</text>
  <g filter="url(#shadow)"><path d="M710.0,440 L800,478.0 L710.0,516 L620,478.0 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/></g>
  <text x="710.0" y="478.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="central">Fewer than 5 tries?</text>
  <rect x="580.2" y="127.0" width="39.5" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="600.0" y="138.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">yes</text>
  <rect x="383.5" y="186.0" width="33.0" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400.0" y="197.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">no</text>
  <rect x="236.2" y="247.0" width="39.5" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="256.0" y="258.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">yes</text>
  <rect x="383.5" y="306.0" width="33.0" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400.0" y="317.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">no</text>
  <rect x="380.2" y="526.0" width="39.5" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400.0" y="537.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">yes</text>
  <rect x="532.5" y="467.0" width="33.0" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="549.0" y="478.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">no</text>
  <rect x="667.5" y="394.0" width="85.0" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="710.0" y="405.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">yes: retry</text>
  <rect x="833.5" y="319.0" width="33.0" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="850.0" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">no</text>
</svg>
