      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1099" height="1031" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="920" y1="70" x2="920" y2="778" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="660" y1="70" x2="660" y2="778" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="400" y1="70" x2="400" y2="778" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="140" y1="70" x2="140" y2="778" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <rect x="46.0" y="428" width="968.0" height="320" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M46.0,428 L82.88,428 L82.88,442 L74.88,450 L46.0,450 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="54.0" y="439.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="start" dominant-baseline="central">alt</text>
  <text x="92.9" y="439.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start" dominant-baseline="central">[rejected]</text>
  <line x1="46.0" y1="504" x2="1014.0" y2="504" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="56.0" y="515.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start" dominant-baseline="central">[accepted]</text>
  <path d="M140,104 L398,104" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,144 L658,144" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M660,184 L918,184" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M920,218 C966,218 966,242 923,242" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M920,270 L402,270" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M140,310 L398,310" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M400,350 L658,350" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M660,384 C706,384 706,408 663,408" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M660,470 L402,470" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M660,534 C706,534 706,558 663,558" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M660,586 L918,586" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M920,620 C966,620 966,644 923,644" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M920,666 C966,666 966,690 923,690" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M920,718 L402,718" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="56.0" y="24" width="168" height="46" rx="23.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/></g>
  <text x="140.0" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">User</text>
  <g filter="url(#shadow)"><rect x="316.0" y="24" width="168" height="46" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/></g>
  <text x="400.0" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="central">Portal</text>
  <g filter="url(#shadow)"><rect x="576.0" y="24" width="168" height="46" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="660.0" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Gateway</text>
  <g filter="url(#shadow)"><rect x="836.0" y="24" width="168" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="920.0" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Service</text>
  <text x="30.0" y="808.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="central">Who may call what</text>
  <g filter="url(#shadow)"><rect x="30" y="828" width="640" height="174" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/></g><path d="M30,836 A8,8 0 0 1 38,828 L662,828 A8,8 0 0 1 670,836 L670,860 L30,860 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="42.0" y="845.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#312e81" text-anchor="start" dominant-baseline="central">path → who</text>
  <text x="42.0" y="875.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/**</text>
  <text x="658.0" y="875.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">CUSTOMER</text>
  <text x="42.0" y="897.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/**</text>
  <text x="658.0" y="897.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">CLAIMS_ADJUSTER</text>
  <text x="42.0" y="919.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/admin/v1/**</text>
  <text x="658.0" y="919.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">CLAIMS_ADJUSTER</text>
  <text x="42.0" y="941.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">POST /auth/login</text>
  <text x="658.0" y="941.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">anyone</text>
  <text x="42.0" y="963.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">PUT /claimant/v1/uploads/*/content</text>
  <text x="658.0" y="963.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">signed URL (HMAC)</text>
  <text x="42.0" y="985.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">POST /internal/v1/**</text>
  <text x="658.0" y="985.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="end" dominant-baseline="central">not routed · HMAC signature</text>
  <text x="700.0" y="848.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Customers get 404, not 403, for claims</text>
  <text x="700.0" y="866.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">that are not theirs, so nothing leaks.</text>
  <text x="700.0" y="884.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central"></text>
  <text x="700.0" y="902.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Claim managers only see and change</text>
  <text x="700.0" y="920.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">claims in the markets on their token.</text>
  <text x="700.0" y="938.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central"></text>
  <text x="700.0" y="956.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Bank account numbers are encrypted</text>
  <text x="700.0" y="974.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">in the database and masked once sent.</text>
  <rect x="192.5" y="82.0" width="155.0" height="17" rx="4" fill="#ffffff"/>
  <text x="270.0" y="91.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">1. username + password</text>
  <rect x="462.2" y="122.0" width="135.5" height="17" rx="4" fill="#ffffff"/>
  <text x="530.0" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">2. POST /auth/login</text>
  <rect x="693.0" y="162.0" width="194.0" height="17" rx="4" fill="#ffffff"/>
  <text x="790.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">3. forward to Claims Service</text>
  <rect x="605.5" y="221.0" width="304.5" height="18" rx="4" fill="#ffffff"/>
  <text x="904.0" y="230.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">4. check the bcrypt hash in platform.app_user</text>
  <rect x="520.8" y="248.0" width="278.5" height="17" rx="4" fill="#ffffff"/>
  <text x="660.0" y="257.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">5. JWT: sub, roles, markets, team (≈ 8 h)</text>
  <rect x="218.5" y="288.0" width="103.0" height="17" rx="4" fill="#ffffff"/>
  <text x="270.0" y="297.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">6. use the app</text>
  <rect x="442.8" y="328.0" width="174.5" height="17" rx="4" fill="#ffffff"/>
  <text x="530.0" y="337.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">7. request + Bearer token</text>
  <rect x="710.0" y="387.0" width="278.5" height="18" rx="4" fill="#ffffff"/>
  <text x="716.0" y="396.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">8. valid token? right role for this path?</text>
  <rect x="442.8" y="448.0" width="174.5" height="17" rx="4" fill="#ffffff"/>
  <text x="530.0" y="457.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">9. 401 / 403 problem+json</text>
  <rect x="710.0" y="537.0" width="220.0" height="18" rx="4" fill="#ffffff"/>
  <text x="716.0" y="546.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">10. rate limit · circuit breaker</text>
  <rect x="748.2" y="564.0" width="83.5" height="17" rx="4" fill="#ffffff"/>
  <text x="790.0" y="573.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">11. forward</text>
  <rect x="677.0" y="623.0" width="233.0" height="18" rx="4" fill="#ffffff"/>
  <text x="904.0" y="632.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">12. check the token and role again</text>
  <rect x="664.0" y="669.0" width="246.0" height="18" rx="4" fill="#ffffff"/>
  <text x="904.0" y="678.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="end" dominant-baseline="central">13. check market scope and ownership</text>
  <rect x="514.2" y="696.0" width="291.5" height="17" rx="4" fill="#ffffff"/>
  <text x="660.0" y="705.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">14. response (404 for someone else&#x27;s claim)</text>
</svg>
