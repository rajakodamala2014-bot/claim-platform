<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="380" viewBox="0 0 1310 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Outbox and topics</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1309" height="379" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="230" y="40" width="330" height="225" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="246.0" y="60.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="start" dominant-baseline="central">ONE DATABASE TRANSACTION</text>
  <path d="M190,110 L228,110" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M535,217 L585,217 L585,165 L608,165" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M810,140 L840,140 L840,85 L868,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M810,170 L840,170 L840,195 L868,195" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1110,78 L1130,78 L1130,52 L1148,52" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1110,92 L1130,92 L1130,118 L1148,118" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1110,195 L1148,195" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1222,220 L1222,305 L1112,305" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M870,305 L105,305 L105,142" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="20" y="80" width="170" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="105.0" y="102.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Claim command</text>
  <text x="105.0" y="119.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">API call · job · consumer</text>
  <g filter="url(#shadow)"><rect x="255" y="75" width="280" height="44" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/></g>
  <text x="395.0" y="89.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle" dominant-baseline="central">core.claim</text>
  <text x="395.0" y="105.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">new status + version</text>
  <g filter="url(#shadow)"><rect x="255" y="135" width="280" height="44" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/></g>
  <text x="395.0" y="149.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle" dominant-baseline="central">core.claim_event</text>
  <text x="395.0" y="165.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">append-only audit</text>
  <g filter="url(#shadow)"><rect x="255" y="195" width="280" height="44" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/></g>
  <text x="395.0" y="209.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle" dominant-baseline="central">platform.outbox</text>
  <text x="395.0" y="225.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">row per message, seq order</text>
  <g filter="url(#shadow)"><rect x="610" y="120" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/></g>
  <text x="710.0" y="139.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle" dominant-baseline="central">Outbox Relay</text>
  <text x="710.0" y="156.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">every 500 ms · ORDER BY seq</text>
  <text x="710.0" y="172.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">one leader (advisory lock)</text>
  <g filter="url(#shadow)"><rect x="870" y="60" width="240" height="50" rx="25.0" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/></g>
  <text x="990.0" y="85.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle" dominant-baseline="central">claims.claim-events</text>
  <g filter="url(#shadow)"><rect x="870" y="170" width="240" height="50" rx="25.0" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/></g>
  <text x="990.0" y="195.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle" dominant-baseline="central">payments.settlement-requests</text>
  <g filter="url(#shadow)"><rect x="1150" y="30" width="145" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="1222.5" y="52.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Insights</text>
  <g filter="url(#shadow)"><rect x="1150" y="96" width="145" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="1222.5" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Notifications</text>
  <g filter="url(#shadow)"><rect x="1150" y="170" width="145" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/></g>
  <text x="1222.5" y="195.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="central">Payments</text>
  <g filter="url(#shadow)"><rect x="870" y="280" width="240" height="50" rx="25.0" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/></g>
  <text x="990.0" y="305.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#581c87" text-anchor="middle" dominant-baseline="central">payments.payment-results</text>
  <text x="620.0" y="222.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">marks rows only after the broker acks</text>
  <text x="620.0" y="240.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">stops at the first failure (keeps order)</text>
  <text x="620.0" y="258.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">masks bank account numbers once sent</text>
  <rect x="336.8" y="294.0" width="286.5" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480.0" y="305.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="middle" dominant-baseline="central">payment result → handled as a new command</text>
</svg>
