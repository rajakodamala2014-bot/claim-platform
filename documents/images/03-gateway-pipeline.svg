<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Gateway request pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1399" height="509" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M150,85 L178,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M255,120 L255,146" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M330,85 L353,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M430,120 L430,146" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M505,85 L528,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M605,120 L605,146" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M680,85 L703,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M780,120 L780,146" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M855,85 L878,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1030,85 L1053,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1205,85 L1228,85" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="20" y="50" width="130" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/></g>
  <text x="85.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Browser</text>
  <text x="85.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">portal or API client</text>
  <g filter="url(#shadow)"><rect x="180" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="255.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Security</text>
  <text x="255.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">token · role</text>
  <g filter="url(#shadow)"><rect x="355" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="430.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Body limit</text>
  <text x="430.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">request size</text>
  <g filter="url(#shadow)"><rect x="530" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="605.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Rate limiter</text>
  <text x="605.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">per user or IP</text>
  <g filter="url(#shadow)"><rect x="705" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="780.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Circuit breaker</text>
  <text x="780.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">per upstream</text>
  <g filter="url(#shadow)"><rect x="880" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="955.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Edge headers</text>
  <text x="955.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">correlation id · forwarded</text>
  <g filter="url(#shadow)"><rect x="1055" y="50" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/></g>
  <text x="1130.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle" dominant-baseline="central">Proxy</text>
  <text x="1130.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">HTTP/1.1</text>
  <g filter="url(#shadow)"><rect x="1230" y="50" width="150" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/></g>
  <text x="1305.0" y="77.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="central">Service</text>
  <text x="1305.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">the routed upstream</text>
  <text x="30.0" y="222.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="central">Routing table · first match wins</text>
  <g filter="url(#shadow)"><rect x="30" y="245" width="305" height="142" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/></g><path d="M30,253 A8,8 0 0 1 38,245 L327,245 A8,8 0 0 1 335,253 L335,277 L30,277 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="42.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start" dominant-baseline="central">Notification Service</text>
  <text x="42.0" y="291.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/notifications/**</text>
  <text x="42.0" y="311.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/notification-preferences</text>
  <text x="42.0" y="331.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/claims/{id}/notifications</text>
  <text x="42.0" y="351.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/admin/v1/templates/**</text>
  <text x="42.0" y="371.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/internal/v1/providers/**</text>
  <g filter="url(#shadow)"><rect x="350" y="245" width="225" height="122" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/></g><path d="M350,253 A8,8 0 0 1 358,245 L567,245 A8,8 0 0 1 575,253 L575,277 L350,277 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="362.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start" dominant-baseline="central">Insights Service</text>
  <text x="362.0" y="291.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/work-queue</text>
  <text x="362.0" y="311.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/search</text>
  <text x="362.0" y="331.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/approvals</text>
  <text x="362.0" y="351.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/insights/**</text>
  <g filter="url(#shadow)"><rect x="590" y="245" width="245" height="162" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/></g><path d="M590,253 A8,8 0 0 1 598,245 L827,245 A8,8 0 0 1 835,253 L835,277 L590,277 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="602.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="start" dominant-baseline="central">Claims Service</text>
  <text x="602.0" y="291.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">POST /auth/login</text>
  <text x="602.0" y="311.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/policies</text>
  <text x="602.0" y="331.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/uploads</text>
  <text x="602.0" y="351.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/claimant/v1/claims/**</text>
  <text x="602.0" y="371.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/claims/**</text>
  <text x="602.0" y="391.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff/v1/people</text>
  <g filter="url(#shadow)"><rect x="850" y="245" width="250" height="122" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/></g><path d="M850,253 A8,8 0 0 1 858,245 L1092,245 A8,8 0 0 1 1100,253 L1100,277 L850,277 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="862.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#991b1b" text-anchor="start" dominant-baseline="central">Not routed · 404</text>
  <text x="862.0" y="291.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/internal/** (other)</text>
  <text x="862.0" y="311.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/actuator/**  /dev/**</text>
  <text x="862.0" y="331.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">any other /claimant,</text>
  <text x="862.0" y="351.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">/staff or /admin path</text>
  <g filter="url(#shadow)"><rect x="1115" y="245" width="215" height="102" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/></g><path d="M1115,253 A8,8 0 0 1 1123,245 L1322,245 A8,8 0 0 1 1330,253 L1330,277 L1115,277 Z" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1127.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#134e4a" text-anchor="start" dominant-baseline="central">Portal (claims-ui)</text>
  <text x="1127.0" y="291.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">every other path:</text>
  <text x="1127.0" y="311.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">the web app&#x27;s pages</text>
  <text x="1127.0" y="331.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#1e293b" text-anchor="start" dominant-baseline="central">and static files</text>
  <text x="30.0" y="430.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Order matters: the specific Notification and Insights paths are checked before the Claims catch-alls.</text>
  <text x="30.0" y="452.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Every service validates the token again (defence in depth); the gateway only stops bad requests early.</text>
  <text x="30.0" y="474.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">The gateway writes X-Correlation-Id and X-Forwarded-Host/Proto/For; values sent by the caller are dropped.</text>
  <rect x="173.5" y="149.0" width="163.0" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="255.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#991b1b" text-anchor="middle" dominant-baseline="central">rejects with 401 / 403</text>
  <rect x="368.0" y="149.0" width="124.0" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="430.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#991b1b" text-anchor="middle" dominant-baseline="central">rejects with 413</text>
  <rect x="543.0" y="149.0" width="124.0" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="605.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#991b1b" text-anchor="middle" dominant-baseline="central">rejects with 429</text>
  <rect x="718.0" y="149.0" width="124.0" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="780.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#991b1b" text-anchor="middle" dominant-baseline="central">rejects with 503</text>
</svg>
