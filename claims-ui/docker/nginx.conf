# Static server for the claims-ui build. Routing and API proxying belong to the gateway, not here.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed bundles never change; index.html is revalidated so a redeploy is picked up at once.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a client-side route (/claims, /claims/<id>, /notifications, /settings).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
