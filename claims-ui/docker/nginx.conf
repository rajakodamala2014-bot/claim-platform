# Static server for the claims-ui build. The gateway is the public entry point, and it proxies
# the portal back here. Port 3000 is also published, so the same API paths are forwarded to the
# gateway; otherwise a sign-in POST hits this static server and nginx answers 405.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. The gateway may not exist yet when this container starts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed bundles never change; index.html is revalidated so a redeploy is picked up at once.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(auth|claimant|staff|admin)/ {
        set $gw gateway;
        proxy_pass http://$gw:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 504 = @starting;
    }

    # The gateway is not listening yet. Give the page a problem+json body instead of nginx's Bad Gateway page.
    location @starting {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"title":"Starting","status":503,"code":"UPSTREAM_UNAVAILABLE","detail":"Sign-in is still starting. Wait a few seconds and try again."}';
    }

    # Any other path is a client-side route (/claims, /claims/<id>, /notifications, /settings).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
