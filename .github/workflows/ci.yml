name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker is available on ubuntu runners, so Testcontainers ITs must run, not be skipped.
      - run: REQUIRE_DOCKER=1 ./scripts/ci.sh
