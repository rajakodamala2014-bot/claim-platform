server:
  port: 8081

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: claims
    password: claims
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

claims:
  security:
    jwt-secret: claims-platform-dev-secret-change-me!!
    issuer: claims-platform
    access-token-ttl: 1h
    internal-token: dev-internal-token
    public-paths:
      - /api/v1/auth/token

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
